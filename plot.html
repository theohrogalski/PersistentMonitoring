<script>
/*------------- tiny helpers ---------------------------------------------*/
const readJSON = (key, def = []) => {
  try { return JSON.parse(localStorage.getItem(key)) ?? def; }
  catch { return def; }
};

const saveFile = (text, name) => {
  const blob = new Blob([text], { type: 'text/csv' });
  const url  = URL.createObjectURL(blob);
  Object.assign(document.createElement('a'), { href: url, download: name }).click();
  URL.revokeObjectURL(url);
};

/*------------- CSV builder ----------------------------------------------*/
function buildUnifiedCSV(times, agentStates) {
  const header = 'xval,yval,agent#';
  const rows = [];

  agentStates.forEach((stateArr, agentIdx) => {
    const checkbox = document.getElementById(`agentSelect${agentIdx}`);    

    stateArr.forEach((y, i) => {                          // i == time index
      rows.push(`${times[i]},${y},${agentIdx + 1}`);
    });
  });

  if (!rows.length) throw new Error('No agents selected (or no data).');
  return [header, ...rows].join('\r\n');
}

/*------------- “Download CSV” button ------------------------------------*/
document.getElementById('csv-button').addEventListener('click', () => {
  const times       = readJSON('eventTimeData');     // [t0, t1, …]
  const agentStates = readJSON('agentStateData');    // [[…], […], …]

  if (!times.length || !agentStates.length) {
    alert('No data in localStorage yet.  Plot something first!');
    return;
  }

  try {
    const csv = buildUnifiedCSV(times, agentStates);
    saveFile(csv, 'agents.csv');
  } catch (e) {
    console.error(e);
    alert(e.message);
  }
});
</script>
